<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A0A">
<title>TALOS teleprompter</title>
<style>
  :root { --bg: #0A0A0A; --ink: #F5F3EE; --red: #CC0000; --dim: rgba(245,243,238,.45); --line: rgba(245,243,238,.14);
    --mono: Consolas, Menlo, "Courier New", monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; }
  header, footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 16px clamp(16px, 4vw, 48px);
    font-family: var(--mono); font-size: 15px; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
  header { border-bottom: 1px solid var(--line); }
  footer { border-top: 1px solid var(--line); flex-wrap: wrap; }
  header b { color: var(--ink); }
  main { flex: 1; overflow-y: auto; padding: clamp(20px, 5vh, 56px) clamp(16px, 6vw, 96px); }
  h1 { font-size: clamp(28px, 4vw, 52px); font-weight: 800; letter-spacing: -.02em; margin-bottom: 8px; }
  .window { font-family: var(--mono); color: var(--dim); font-size: 16px; margin-bottom: clamp(20px, 4vh, 40px); }
  .script p { font-size: clamp(26px, 3.6vw, 48px); line-height: 1.35; margin-bottom: .55em; max-width: 34em; }
  .key { font-family: var(--mono); color: var(--red); font-weight: 700; font-size: .85em; margin-right: .4em; white-space: nowrap; }
  .stage { color: var(--red); font-style: italic; }
  .timer { font-size: clamp(28px, 4vw, 44px); color: var(--ink); letter-spacing: .02em; }
  .timer.over { color: var(--red); }
  .btns { display: flex; gap: 8px; }
  button { font: 600 15px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: none;
    border: 1px solid var(--line); padding: 12px 16px; min-height: 44px; cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--ink); outline: none; }
  .hint { width: 100%; font-size: 13px; }
  .btns { flex-wrap: wrap; }
  @media (max-width: 640px) {
    header { font-size: 13px; }
    .btns { width: 100%; }
    button { flex: 1; padding: 10px 6px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header><span><b>TALOS</b> · teleprompter · 4:46</span><span id="speaker"></span><span id="pos"></span></header>
<main><h1 id="title"></h1><div class="window" id="window"></div><div class="script" id="script"></div></main>
<footer>
  <span class="timer" id="timer">0:00</span>
  <span class="btns"><button id="prev">← Prev</button><button id="go">Start</button><button id="next">Next →</button><button id="reset">Reset</button></span>
  <span class="hint">← → change slide · Space start/pause the clock · R reset · → in red = press the key on the deck · deck key A = fine print for Q&amp;A</span>
</footer>
<script>
// [title, start s, end s, lines]. "→" starts a line where you press the key on the deck; [..] is a stage direction.
// The numbers, hospital and "It fails" slides play by themselves after one press, so they have no "→".
const SLIDES = [
  [
    "The problem",
    0,
    6,
    [
      "[Problem slide] Nurses are short-staffed, and robots can't be programmed for every task. We built the loop that teaches them."
    ],
    "Alp Eldam"
  ],
  [
    "Our robot in numbers",
    6,
    46,
    [
      "Do you know what these numbers mean?",
      "At least five nurses we called.",
      "Nearly fifteen hundred public FDA reports we scanned.",
      "Eighty-four demonstrations, but the same robot movement.",
      "One hundred seventy-three demonstrations generated in simulation.",
      "Thirteen to fifty percent: boxes placed on the tray, before and after retraining, on the same thirty scenarios.",
      "[Pause] Built on site. Tested in simulation."
    ],
    "Alp Eldam"
  ],
  [
    "The robot comparison",
    46,
    66,
    [
      "[Speak while the clip plays] This is a recorded replay. Same scenario, same start, replayed faster.",
      "Left, our first model misses the grasp. Right, the next model puts the box on the tray. That is the placement result we measure here."
    ],
    "Alp Eldam"
  ],
  [
    "How does it work?",
    66,
    176,
    [
      "So how does it work?",
      "→ Demonstrations come in. We check the data, train ACT, test it in Isaac Sim, and load the model to control the robot. ACT learns movements from camera images and the robot's position.",
      "→ When it fails, our tools suggest what new examples to try. Our scripted expert generates them, and we run training.",
      "→ We compare the results and choose which model to keep.",
      "→ [Video at 2×, 40 s: one real cycle, round 1 to round 2. Press → to move on]",
      "→ Here are the thirty scenarios. Round one: four boxes placed.",
      "→ Round two: fifteen. Twelve got better, one got worse. This is what we are proudest of. We changed both the data and training time, and used these scenarios during development.",
      "→ Round three got worse, so we kept round two."
    ],
    "Alp Eldam"
  ],
  [
    "A hospital example",
    176,
    211,
    [
      "We called nurses to understand their work. Alongside robot learning, we built two features for the operating room.",
      "One: counting. The camera counts the instruments in view.",
      "Two: sterility. It warns when a hand may have touched a sterile instrument.",
      "We collected nearly fifteen hundred public FDA reports to understand the problems, and one study found counting problems during roughly one in eight operations."
    ],
    "Alp Eldam"
  ],
  [
    "Instrument demo",
    211,
    231,
    [
      "[Speak while the video plays] The camera counts two pairs of scissors. It flags a possible touch for review.",
      "The red colour is a warning. It cannot tell us whether something is truly sterile."
    ],
    "Alp Eldam"
  ],
  [
    "What comes next",
    231,
    253,
    [
      "Next: in-and-out counting. Count every instrument before and after surgery, so nothing stays inside the patient. Nurses told us this count takes much of their time. And new test scenarios for the full handover."
    ],
    "Alp Eldam"
  ],
  [
    "It fails. It learns. It adapts.",
    253,
    273,
    [
      "It fails. We inspect what went wrong.",
      "It learns. We generate more examples and retrain the model.",
      "It adapts. We compare the versions and choose which to keep. We run this process ourselves."
    ],
    "Alp Eldam"
  ],
  [
    "We are TALOS",
    273,
    286,
    [
      "We built a learning loop that helps us improve a robot, and see when it still struggles. Scan here for our code, documentation and findings. We are TALOS."
    ],
    "Alp Eldam"
  ]
];

const $ = id => document.getElementById(id);
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
let i = 0, running = false, started = 0, elapsed = 0;

function show() {
  const [title, a, b, lines, speaker] = SLIDES[i];
  $('speaker').textContent = speaker;
  $('pos').textContent = `${i + 1} / ${SLIDES.length}`;
  $('title').textContent = title;
  $('window').textContent = `${fmt(a)} – ${fmt(b)}`;
  $('script').innerHTML = lines.map(l => '<p>' + esc(l)
    .replace(/^→ /, '<span class="key">→</span>')
    .replace(/\[(.+?)\]/g, '<span class="stage">$1</span>') + '</p>').join('');
  $('script').parentElement.scrollTop = 0;
  try { localStorage.setItem('talos-tp-slide', String(i)); } catch (e) {}
}
function clock() {
  const t = running ? elapsed + (performance.now() - started) / 1000 : elapsed;
  $('timer').textContent = fmt(t);
  $('timer').classList.toggle('over', t > SLIDES[i][2]);
  requestAnimationFrame(clock);
}
const move = d => { i = Math.max(0, Math.min(SLIDES.length - 1, i + d)); show(); };
function toggle() {
  if (running) { elapsed += (performance.now() - started) / 1000; running = false; }
  else { started = performance.now(); running = true; }
  $('go').textContent = running ? 'Pause' : 'Start';
}
function reset() { running = false; elapsed = 0; i = 0; $('go').textContent = 'Start'; show(); }

$('prev').onclick = () => move(-1);
$('next').onclick = () => move(1);
$('go').onclick = toggle;
$('reset').onclick = reset;
addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown'].includes(e.key)) { e.preventDefault(); move(1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); move(-1); }
  else if (e.key === ' ') { e.preventDefault(); toggle(); }
  else if (e.key === 'r' || e.key === 'R') reset();
});
try { i = Math.min(SLIDES.length - 1, +localStorage.getItem('talos-tp-slide') || 0); } catch (e) {}
show();
clock();
</script>
</body>
</html>
