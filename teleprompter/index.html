<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A0A">
<title>TALOS teleprompter</title>
<style>
  :root { --bg: #0A0A0A; --ink: #F5F3EE; --red: #CC0000; --dim: rgba(245,243,238,.45); --line: rgba(245,243,238,.14);
    --mono: Consolas, Menlo, "Courier New", monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; }
  header, footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 16px clamp(16px, 4vw, 48px);
    font-family: var(--mono); font-size: 15px; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
  header { border-bottom: 1px solid var(--line); }
  footer { border-top: 1px solid var(--line); flex-wrap: wrap; }
  header b { color: var(--ink); }
  main { flex: 1; overflow-y: auto; padding: clamp(20px, 5vh, 56px) clamp(16px, 6vw, 96px); }
  h1 { font-size: clamp(28px, 4vw, 52px); font-weight: 800; letter-spacing: -.02em; margin-bottom: 8px; }
  .window { font-family: var(--mono); color: var(--dim); font-size: 16px; margin-bottom: clamp(20px, 4vh, 40px); }
  .script p { font-size: clamp(26px, 3.6vw, 48px); line-height: 1.35; margin-bottom: .55em; max-width: 34em; }
  .key { font-family: var(--mono); color: var(--red); font-weight: 700; font-size: .85em; margin-right: .4em; white-space: nowrap; }
  .stage { color: var(--red); font-style: italic; }
  .timer { font-size: clamp(28px, 4vw, 44px); color: var(--ink); letter-spacing: .02em; }
  .timer.over { color: var(--red); }
  .btns { display: flex; gap: 8px; }
  button { font: 600 15px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: none;
    border: 1px solid var(--line); padding: 12px 16px; min-height: 44px; cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--ink); outline: none; }
  .hint { width: 100%; font-size: 13px; }
  .btns { flex-wrap: wrap; }
  @media (max-width: 640px) {
    header { font-size: 13px; }
    .btns { width: 100%; }
    button { flex: 1; padding: 10px 6px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header><span><b>TALOS</b> · teleprompter · 4:00</span><span id="speaker"></span><span id="pos"></span></header>
<main><h1 id="title"></h1><div class="window" id="window"></div><div class="script" id="script"></div></main>
<footer>
  <span class="timer" id="timer">0:00</span>
  <span class="btns"><button id="prev">← Prev</button><button id="go">Start</button><button id="next">Next →</button><button id="reset">Reset</button></span>
  <span class="hint">← → change slide · Space start/pause the clock · R reset · → in red = press the key on the deck · deck key A = fine print for Q&amp;A</span>
</footer>
<script>
// [title, start s, end s, lines]. "→" starts a line where you press the key on the deck; [..] is a stage direction.
const SLIDES = [
  [
    "The learning workflow",
    0,
    40,
    [
      "[Start on slide 1] TALOS helps engineers teach and test robot skills. Equipment handling motivates the work. These numbers explain what we built.",
      "→ Five stages connect demonstrations to a served robot policy.",
      "→ Thirty scenarios let us compare versions.",
      "→ Eighty-four supplied episodes repeated one robot movement.",
      "→ Our selected model used one hundred fourteen generated demonstrations.",
      "→ Its placement score rose from thirteen to fifty percent.",
      "→ [Pause] We built and tested this in simulation."
    ],
    "Alp Eldam"
  ],
  [
    "Failure, retraining and comparison",
    40,
    60,
    [
      "We wanted to make the next experiment clearer when the robot fails.",
      "→ Our diagnostics suggest additional demonstrations. A scripted expert generates them, and we run training.",
      "→ We compare the new model with the previous one and decide which to keep. Here is the result."
    ],
    "Alp Eldam"
  ],
  [
    "Recorded placement comparison",
    60,
    80,
    [
      "[Let the 10-second clip play] These are recorded action replays of the same scenario, seven and a half times faster.",
      "On the left, round one misses the grasp. On the right, round two places the box on the tray. This illustrates placement, not proof of a complete handover."
    ],
    "Alp Eldam"
  ],
  [
    "The five-stage stack",
    80,
    150,
    [
      "Here is how we connected the stack.",
      "→ We ingest demonstrations, check their quality, train with LeRobot ACT, evaluate in Isaac Sim and serve the saved policy. ACT learns movement sequences from images and robot state. We chose it because it fitted the interface and let us test the full workflow.",
      "→ Diagnostics suggest further data collection. People run generation and retraining.",
      "→ A comparison gate supports our selection. We still need to connect all quality checks to training and deployment.",
      "→ Each square is one of thirty scenarios. Round one placed four boxes.",
      "→ After changing the data and training for longer, round two placed fifteen. Twelve scenarios improved and one regressed. The score checks final placement. These scenarios also informed development.",
      "→ Round three fell to twelve, so we kept round two. More training does not guarantee a better robot."
    ],
    "Alp Eldam"
  ],
  [
    "Hospital motivation and an extension",
    150,
    185,
    [
      "The challenge motivates equipment handling in clinical settings. We also explored instrument accountability.",
      "→ Our research corpus includes fourteen hundred ninety-seven public FDA reports. That count describes the corpus, not how common a problem is.",
      "→ Contact tracking and counting became a separate prototype.",
      "→ One published study found count discrepancies during nineteen of one hundred forty-eight operations. That motivates assistance. We have not measured clinical benefit."
    ],
    "Alp Eldam"
  ],
  [
    "Contact and counting prototype",
    185,
    205,
    [
      "[Let the video play] The prototype counts two pairs of scissors and flags detected hand contact. The flag stays on for review.",
      "The colour records a contact rule. It cannot determine biological sterility. A trained person would still make that judgement."
    ],
    "Alp Eldam"
  ],
  [
    "Next steps",
    205,
    240,
    [
      "Next, we need better camera inputs and more varied demonstrations. We then need a fresh test set and a success check for the whole handover.",
      "We trained the ACT control policy from scratch. Testing a pretrained robot model is another next step. Real hardware would need calibration, recovery and supervised validation.",
      "→ TALOS gives engineers a way to inspect data, compare robot skills and decide what to try next. Scan the code for our team guide and project links. We are TALOS."
    ],
    "Alp Eldam"
  ]
];

const $ = id => document.getElementById(id);
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
let i = 0, running = false, started = 0, elapsed = 0;

function show() {
  const [title, a, b, lines, speaker] = SLIDES[i];
  $('speaker').textContent = speaker;
  $('pos').textContent = `${i + 1} / ${SLIDES.length}`;
  $('title').textContent = title;
  $('window').textContent = `${fmt(a)} – ${fmt(b)}`;
  $('script').innerHTML = lines.map(l => '<p>' + esc(l)
    .replace(/^→ /, '<span class="key">→</span>')
    .replace(/\[(.+?)\]/g, '<span class="stage">$1</span>') + '</p>').join('');
  $('script').parentElement.scrollTop = 0;
  try { localStorage.setItem('talos-tp-slide', String(i)); } catch (e) {}
}
function clock() {
  const t = running ? elapsed + (performance.now() - started) / 1000 : elapsed;
  $('timer').textContent = fmt(t);
  $('timer').classList.toggle('over', t > SLIDES[i][2]);
  requestAnimationFrame(clock);
}
const move = d => { i = Math.max(0, Math.min(SLIDES.length - 1, i + d)); show(); };
function toggle() {
  if (running) { elapsed += (performance.now() - started) / 1000; running = false; }
  else { started = performance.now(); running = true; }
  $('go').textContent = running ? 'Pause' : 'Start';
}
function reset() { running = false; elapsed = 0; i = 0; $('go').textContent = 'Start'; show(); }

$('prev').onclick = () => move(-1);
$('next').onclick = () => move(1);
$('go').onclick = toggle;
$('reset').onclick = reset;
addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown'].includes(e.key)) { e.preventDefault(); move(1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); move(-1); }
  else if (e.key === ' ') { e.preventDefault(); toggle(); }
  else if (e.key === 'r' || e.key === 'R') reset();
});
try { i = Math.min(SLIDES.length - 1, +localStorage.getItem('talos-tp-slide') || 0); } catch (e) {}
show();
clock();
</script>
</body>
</html>
